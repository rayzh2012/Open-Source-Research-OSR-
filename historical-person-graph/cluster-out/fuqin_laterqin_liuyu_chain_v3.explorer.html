function edgeVisible(e){if(relation.value&&e.relation_type!==relation.value)return false;if(maxYear==null)return true;const sy=yearOf(e.start_text),ev=G.eventsById.get(Number(e.event_id)),ey=yearOf(ev?.date_text),t=sy??ey;return t==null||t<=maxYear}
function loadGraph(g){G=g;G.nodesById=new Map(g.nodes.map(n=>[Number(n.id),n]));G.eventsById=new Map(g.events.map(e=>[Number(e.id),e]));G.sourcesById=new Map(g.sources.map(s=>[Number(s.id),s]));const types=[...new Set(g.edges.map(e=>e.relation_type))].sort();relation.innerHTML='<option value="">全部关系</option>'+types.map(t=>`<option>${esc(t)}</option>`).join('');const ys=[...g.events.map(e=>yearOf(e.date_text)),...g.edges.map(e=>yearOf(e.start_text))].filter(Number.isFinite);if(ys.length){year.disabled=false;year.min=Math.min(...ys);year.max=Math.max(...ys);year.value=year.max;maxYear=null;yearLabel.textContent='全部'}else{year.disabled=true;maxYear=null}selected=g.nodes[0]?.id??null;render()}
function related(id){const es=G.edges.filter(e=>edgeVisible(e)&&(Number(e.source)===Number(id)||Number(e.target)===Number(id)));const ids=[...new Set(es.map(e=>Number(e.source)===Number(id)?Number(e.target):Number(e.source)))];return{edges:es,nodes:ids.map(i=>G.nodesById.get(i)).filter(Boolean)}}function render(){if(!G||selected==null)return;draw();details()}
function draw(){svg.innerHTML='';const c=G.nodesById.get(Number(selected));if(!c)return;const rel=related(selected),ns=rel.nodes,cx=500,cy=340,R=Math.min(275,110+ns.length*9),pos=new Map([[Number(c.id),[cx,cy]]]);ns.forEach((n,i)=>{const a=Math.PI*2*i/Math.max(ns.length,1)-Math.PI/2;pos.set(Number(n.id),[cx+Math.cos(a)*R,cy+Math.sin(a)*R])});const NS='http://www.w3.org/2000/svg';for(const e of rel.edges){const a=pos.get(Number(e.source)),b=pos.get(Number(e.target));if(!a||!b)continue;const l=document.createElementNS(NS,'line');Object.entries({x1:a[0],y1:a[1],x2:b[0],y2:b[1],class:'edge'}).forEach(([k,v])=>l.setAttribute(k,v));svg.appendChild(l);const t=document.createElementNS(NS,'text');t.setAttribute('x',(a[0]+b[0])/2);t.setAttribute('y',(a[1]+b[1])/2-4);t.setAttribute('class','edge-label');t.textContent=e.relation_type;svg.appendChild(t)}for(const n of[c,...ns]){const[x,y]=pos.get(Number(n.id)),g=document.createElementNS(NS,'g');g.setAttribute('class','node '+(Number(n.id)===Number(selected)?'center':''));g.setAttribute('transform',`translate(${x},${y})`);const circle=document.createElementNS(NS,'circle');circle.setAttribute('r',Number(n.id)===Number(selected)?34:27);g.appendChild(circle);const t=document.createElementNS(NS,'text');t.setAttribute('text-anchor','middle');t.setAttribute('dy',Number(n.id)===Number(selected)?53:44);t.textContent=n.name;g.appendChild(t);g.onclick=()=>{selected=n.id;render()};svg.appendChild(g)}}
function sourceLine(id){const s=G.sourcesById.get(Number(id));if(!s)return'';const p=s.provenance||{};return[p.source,p.file,p.repo,p.row!=null?'row '+p.row:null].filter(Boolean).join(' · ')||('source '+id)}
function details(){const n=G.nodesById.get(Number(selected)),rel=related(selected),eventIds=new Set(rel.edges.map(e=>Number(e.event_id)).filter(Boolean)),events=G.events.filter(e=>eventIds.has(Number(e.id))||(e.participants||[]).map(Number).includes(Number(selected))),slices=G.slices.filter(s=>Number(s.person_id)===Number(selected)),srcIds=new Set([...rel.edges.map(e=>e.source_id),...slices.map(s=>s.source_id),...events.map(e=>e.source_id)].filter(Boolean));let body='';if(tab==='events')body=events.length?events.map(e=>`<div class="item"><span class="badge">${esc(e.certainty)}</span><b>${esc(e.date_text||'未定年')}</b> · ${esc(e.event_type||'event')}<br>${esc(e.summary)}<div class="muted">${esc(e.evidence||'')}</div></div>`).join(''):'<div class="muted">当前人物没有挂接事件。</div>';if(tab==='relations')body=rel.edges.length?rel.edges.map(e=>{const other=Number(e.source)===Number(selected)?G.nodesById.get(Number(e.target)):G.nodesById.get(Number(e.source));return`<div class="item"><span class="badge">${esc(e.certainty)}</span><b>${esc(e.relation_type)}</b> → ${esc(other?.name||'?')}<div class="muted">${esc(e.start_text||'')} ${esc(e.evidence||'')}</div></div>`}).join(''):'<div class="muted">没有可见关系。</div>';if(tab==='slices')body=slices.length?slices.map(s=>`<div class="item"><span class="badge">${esc(s.certainty)}</span><b>${esc(s.slice_type)}</b><br>${esc(s.claim)}<div class="muted">${esc(s.evidence||'')}</div></div>`).join(''):'<div class="muted">尚未编译 Historical Slice。</div>';if(tab==='sources')body=srcIds.size?[...srcIds].map(id=>`<div class="item"><b>${esc(sourceLine(id))}</b><div class="muted">SHA ${esc((G.sourcesById.get(Number(id))?.row_sha256||'').slice(0,16))}…</div></div>`).join(''):'<div class="muted">没有 provenance。</div>';side.innerHTML=`<div class="name">${esc(n.name)}</div><div class="context muted">${esc(n.context||'未消歧')} · ${esc(n.resolution_status||'OPEN')} · ${esc(n.certainty||'OPEN')}</div><div class="tabs">${['events','relations','slices','sources'].map(x=>`<button data-tab="${x}" class="${tab===x?'active':''}">${{events:'事件',relations:'关系',slices:'切片',sources:'史源'}[x]}</button>`).join('')}</div>${body}`;side.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;details()})}
$('file').onchange=async e=>{const f=e.target.files[0];if(f)loadGraph(JSON.parse(await f.text()))};search.oninput=()=>{if(!G)return;const q=search.value.trim();if(!q)return;const n=G.nodes.find(n=>n.name.includes(q)||(n.aliases||[]).some(a=>a.includes(q)));if(n){selected=n.id;render()}};relation.onchange=render;year.oninput=()=>{maxYear=Number(year.value);yearLabel.textContent=String(maxYear);render()};year.ondblclick=()=>{maxYear=null;yearLabel.textContent='全部';render()};
loadGraph(JSON.parse(document.getElementById('graph-data').textContent));
</script></body></html>
