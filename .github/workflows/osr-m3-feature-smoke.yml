name: OSR M3 Feature Store Smoke

on:
  push:
    branches: [stage2-direct-miner-v3-1]
    paths:
      - control/m3_feature_smoke_request.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage2-direct-miner-v3-1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pyarrow==21.0.0 requests==2.32.4 huggingface_hub==0.34.4
      - name: Run representative M3 feature smoke
        run: python tools/osr_m3_feature_smoke.py
      - name: Commit compact feature smoke result
        run: |
          git config user.name 'osr-actions-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add control/m3_feature_smoke_summary.json control/m3_feature_smoke_result.json.gz
          git diff --cached --quiet && exit 0
          git commit -m 'm3: representative feature-store smoke result'
          git pull --rebase origin stage2-direct-miner-v3-1
          git push origin HEAD:stage2-direct-miner-v3-1
