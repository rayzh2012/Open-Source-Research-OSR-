name: OSR M5 Evidence Analyze

on:
  push:
    branches: [stage2-direct-miner-v3-1]
    paths:
      - control/m5_exact_evidence_result.json
      - control/m5_downstream_trigger.json
      - tools/osr_m5_evidence_analyzer.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage2-direct-miner-v3-1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/osr_m5_evidence_analyzer.py
      - name: Archive run-specific analysis
        shell: python
        run: |
          import json, pathlib, shutil
          p=pathlib.Path('control/m5_evidence_analysis.json')
          d=json.loads(p.read_text('utf-8'))
          run=d.get('run_id')
          if run:
              out=pathlib.Path('control/research_runs')/run
              out.mkdir(parents=True,exist_ok=True)
              shutil.copyfile(p,out/'evidence_analysis.json')
      - name: Commit analysis
        run: |
          git config user.name 'osr-actions-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add control/m5_evidence_analysis.json control/research_runs/
          git diff --cached --quiet && exit 0
          git commit -m 'm5: evidence analysis'
          git pull --rebase origin stage2-direct-miner-v3-1
          git push origin HEAD:stage2-direct-miner-v3-1
