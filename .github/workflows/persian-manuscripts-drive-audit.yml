name: Persian Manuscripts Drive Audit

on:
  push:
    branches: [stage2-direct-miner-v3-1]
    paths: ['.github/workflows/persian-manuscripts-drive-audit.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RCLONE_CONFIG_B64: ${{ secrets.RCLONE_CONFIG_B64 }}
    steps:
      - name: Audit manuscript COMPLETE records
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null
          mkdir -p "$HOME/.config/rclone"
          printf '%s' "$RCLONE_CONFIG_B64" | base64 -d > "$HOME/.config/rclone/rclone.conf"
          chmod 600 "$HOME/.config/rclone/rclone.conf"
          python - <<'PY'
          import collections,json,subprocess
          expected=15
          root='gdrive:龍族古籍源庫｜Dragon Source Corpus/ISLAMIC_PERSIAN_RESCUE/manuscripts'
          p=subprocess.run(['rclone','lsjson',root,'--recursive','--files-only'],text=True,capture_output=True,check=True)
          files=json.loads(p.stdout or '[]'); cps=[x['Path'] for x in files if x.get('Path','').endswith('/COMPLETE.json')]
          rows=[];errors=[];mismatch=[]
          for path in cps:
            q=subprocess.run(['rclone','cat',f'{root}/{path}'],text=True,capture_output=True)
            if q.returncode: errors.append({'path':path,'error':'cat_failed'});continue
            try:o=json.loads(q.stdout)
            except Exception as e:errors.append({'path':path,'error':str(e)});continue
            folder=path.split('/',1)[0]
            if o.get('id')!=folder:mismatch.append({'folder':folder,'id':o.get('id'),'ia_id':o.get('ia_id')})
            rows.append(o)
          passed=[x for x in rows if x.get('status')=='PASS']; ia=collections.Counter(x.get('ia_id') for x in passed if x.get('ia_id')); dup=sorted(k for k,v in ia.items() if v>1)
          missing_license=[x.get('id') for x in passed if not x.get('licenseurl')]
          total=0; by_license=collections.Counter(); file_count=0
          for x in passed:
            by_license[x.get('license') or 'UNKNOWN']+=1
            for v in (x.get('files') or {}).values(): total+=int((v or {}).get('bytes') or 0);file_count+=1
          out={'schema_version':'osr-persian-manuscript-audit-v1','expected':expected,'complete_files':len(cps),'parsed':len(rows),'pass':len(passed),'file_count':file_count,'total_preserved_bytes':total,'by_license':dict(by_license),'identity_mismatches':mismatch,'duplicate_ia_ids':dup,'missing_licenseurl':missing_license,'parse_errors':errors,'ids':sorted(x.get('id','') for x in passed)}
          out['status']='PASS' if len(cps)==expected and len(cps)==len(rows)==len(passed) and not mismatch and not dup and not missing_license and not errors else 'FAIL'
          print('RESULT_JSON='+json.dumps(out,ensure_ascii=False,sort_keys=True))
          if out['status']!='PASS': raise SystemExit(2)
          PY
