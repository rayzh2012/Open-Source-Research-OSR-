name: Persian Reference Catalogues Batch 5 Blochet BnF

on:
  push:
    branches: [stage2-direct-miner-v3-1]
    paths:
      - 'control/persian_catalogue_rescue_targets_batch5_blochet.json'
      - 'control/persian_manuscript_rescue_worker.py'
      - '.github/workflows/persian-reference-catalogues-batch5-blochet.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          o=json.load(open('control/persian_catalogue_rescue_targets_batch5_blochet.json'))
          print('matrix='+json.dumps({'target':[x['id'] for x in o['items']]}))
          PY
  rescue:
    needs: plan
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      RCLONE_CONFIG_B64: ${{ secrets.RCLONE_CONFIG_B64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Configure
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check requests
          curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null
          mkdir -p "$HOME/.config/rclone"
          printf '%s' "$RCLONE_CONFIG_B64" | base64 -d > "$HOME/.config/rclone/rclone.conf"
          chmod 600 "$HOME/.config/rclone/rclone.conf"
      - name: Preserve Blochet catalogue volume
        shell: bash
        run: |
          set -o pipefail
          mkdir -p result
          python control/persian_manuscript_rescue_worker.py \
            --target-id '${{ matrix.target }}' \
            --registry control/persian_catalogue_rescue_targets_batch5_blochet.json \
            --work-dir '/tmp/blochet-${{ matrix.target }}' 2>&1 | tee 'result/${{ matrix.target }}.log'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blochet-catalogue-${{ matrix.target }}-${{ github.run_id }}
          path: result/
          retention-days: 30
