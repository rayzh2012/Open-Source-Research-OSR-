name: Fetch Sun Hua Full Book Research Window

on:
  push:
    paths:
      - '.github/workflows/fetch-sunhua-bronze-age.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOURCE_URL: 'https://s3.us-west-1.wasabisys.com/p-library/books/a0efb777d04fc6a3e66b18c03f36fe6a.pdf'
      PDF: 'Sun_Hua_Sichuan_Basin_Bronze_Age_2000_FULL.pdf'
    steps:
      - name: Download and validate full PDF
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 6 --retry-all-errors --retry-delay 3 \
            --connect-timeout 30 --max-time 1500 \
            -A 'Mozilla/5.0' \
            "$SOURCE_URL" -o "$PDF"
          test "$(head -c 5 "$PDF")" = "%PDF-"
          python -m pip install --quiet pypdf
          python - <<'PY'
          from pypdf import PdfReader
          r=PdfReader("Sun_Hua_Sichuan_Basin_Bronze_Age_2000_FULL.pdf")
          n=len(r.pages)
          print(f"Pages: {n}")
          open("PDFINFO.txt","w").write(f"Pages: {n}\n")
          assert n > 350, n
          PY
          stat -c '%s %n' "$PDF" | tee SIZE.txt
          sha256sum "$PDF" | tee SHA256SUMS.txt

      - name: Extract printed pages 320-352 research window
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pypdf
          python - <<'PY'
          from pypdf import PdfReader, PdfWriter
          from pathlib import Path
          r=PdfReader("Sun_Hua_Sichuan_Basin_Bronze_Age_2000_FULL.pdf")
          # In this edition printed p.1 begins around physical PDF p.5.
          # Use a wide physical-page window to safely cover printed pp.320-352.
          start=max(0,320)   # zero-based => physical page 321
          end=min(len(r.pages)-1,360) # physical page 361
          w=PdfWriter()
          txt=[]
          hits=[]
          for i in range(start,end+1):
              p=r.pages[i]
              w.add_page(p)
              try: t=p.extract_text() or ""
              except Exception: t=""
              txt.append(f"\n===== FULL_PDF_PAGE_{i+1} =====\n{t}")
              c=t.replace(" ","").replace("\n","")
              if "鳖灵名义考" in c or "蜀人渊源考" in c:
                  hits.append(i+1)
          with open("SunHua_Bieling_ShuOrigins_window.pdf","wb") as f: w.write(f)
          Path("SunHua_Bieling_ShuOrigins_window.txt").write_text("\n".join(txt),encoding="utf-8")
          Path("RANGE.txt").write_text(f"full_pdf_pages={len(r.pages)}\nwindow_physical_pages={start+1}-{end+1}\ntitle_hits={hits}\n",encoding="utf-8")
          PY
          cat RANGE.txt
          ls -lh SunHua_Bieling_ShuOrigins_window.pdf SunHua_Bieling_ShuOrigins_window.txt

      - name: Upload research window artifact
        uses: actions/upload-artifact@v4
        with:
          name: sunhua-full-bieling-shuorigins-window
          path: |
            SunHua_Bieling_ShuOrigins_window.pdf
            SunHua_Bieling_ShuOrigins_window.txt
            RANGE.txt
            PDFINFO.txt
            SIZE.txt
            SHA256SUMS.txt
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
