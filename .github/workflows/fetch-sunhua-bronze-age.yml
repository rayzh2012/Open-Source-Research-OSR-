name: Resolve Sun Hua Full PDF Link

on:
  push:
    paths:
      - '.github/workflows/fetch-sunhua-bronze-age.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect library download page
        shell: bash
        run: |
          set -euo pipefail
          URL='https://www.proletarian.me/download.php?book=%E5%9B%9B%E5%B7%9D%E7%9B%86%E5%9C%B0%E7%9A%84%E9%9D%92%E9%93%9C%E6%97%B6%E4%BB%A3&link=books%2Fa0efb777d04fc6a3e66b18c03f36fe6a.pdf'
          curl -fL -A 'Mozilla/5.0' "$URL" -o page.html
          echo '--- LINKS ---'
          grep -Eo '(href|src)=["'"'][^"'"']+["'"']' page.html | head -100
          echo '--- HASH CONTEXT ---'
          grep -n -C 3 'a0efb777d04fc6a3e66b18c03f36fe6a' page.html || true
          echo '--- PDF CONTEXT ---'
          grep -n -C 3 -Ei '\\.pdf|download|books/' page.html | head -160 || true
      - name: Upload resolver page
        uses: actions/upload-artifact@v4
        with:
          name: sunhua-download-resolver
          path: page.html
          retention-days: 1
