name: Historical Person Graph Smoke

on:
  push:
    paths:
      - 'tools/osr_historical_person_graph.py'
      - 'tools/osr_historical_person_graph_smoke.py'
      - 'tools/osr_historical_person_gold20_baseline.py'
      - 'historical-person-graph/**'
      - '.github/workflows/historical-person-graph-smoke.yml'
  pull_request:
    paths:
      - 'tools/osr_historical_person_graph.py'
      - 'tools/osr_historical_person_graph_smoke.py'
      - 'tools/osr_historical_person_gold20_baseline.py'
      - 'historical-person-graph/**'
      - '.github/workflows/historical-person-graph-smoke.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests
      - run: python -m py_compile tools/osr_historical_person_graph.py tools/osr_historical_person_gold20_baseline.py
      - run: PYTHONPATH=tools python tools/osr_historical_person_graph_smoke.py
      - name: Real-source Lv Guang gold-20 deterministic baseline
        run: PYTHONPATH=tools python tools/osr_historical_person_gold20_baseline.py
      - name: Upload gold-20 baseline graph
        uses: actions/upload-artifact@v4
        with:
          name: lvguang-gold20-baseline
          path: historical-person-graph/baseline-out/
          if-no-files-found: error
