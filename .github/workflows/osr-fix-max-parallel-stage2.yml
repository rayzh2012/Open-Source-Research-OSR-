name: OSR One-shot Fix Stage2 M3 max_parallel

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/osr-fix-max-parallel-stage2.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-stage2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage2-direct-miner-v3-1
          fetch-depth: 0

      - name: Patch and statically verify M3 concurrency wiring
        shell: python
        run: |
          import json
          import pathlib
          import time

          workflow = pathlib.Path('.github/workflows/osr-feature-extraction.yml')
          request = pathlib.Path('control/feature_extraction_request.json')
          text = workflow.read_text('utf-8')
          req = json.loads(request.read_text('utf-8'))
          requested = int(req.get('max_parallel', 20))
          assert 1 <= requested <= 20, requested

          output_anchor = "      partition_count: ${{ steps.plan.outputs.partition_count }}\n      limit_per_partition: ${{ steps.plan.outputs.limit_per_partition }}"
          output_repl = "      partition_count: ${{ steps.plan.outputs.partition_count }}\n      max_parallel: ${{ steps.plan.outputs.max_parallel }}\n      limit_per_partition: ${{ steps.plan.outputs.limit_per_partition }}"
          assert text.count(output_anchor) == 1, text.count(output_anchor)
          text = text.replace(output_anchor, output_repl, 1)

          go_anchor = "              f.write(f'partition_count={partition_count}\\n')\n              f.write(f'limit_per_partition={limit}\\n')"
          go_repl = "              f.write(f'partition_count={partition_count}\\n')\n              f.write(f'max_parallel={max_parallel}\\n')\n              f.write(f'limit_per_partition={limit}\\n')"
          assert text.count(go_anchor) == 1, text.count(go_anchor)
          text = text.replace(go_anchor, go_repl, 1)

          hardcoded = "      max-parallel: 20"
          dynamic = "      max-parallel: ${{ fromJson(needs.plan.outputs.max_parallel) }}"
          assert text.count(hardcoded) == 2, text.count(hardcoded)
          text = text.replace(hardcoded, dynamic)

          assert text.count("max_parallel: ${{ steps.plan.outputs.max_parallel }}") == 1
          assert text.count("f.write(f'max_parallel={max_parallel}\\n')") == 1
          assert text.count(dynamic) == 2
          assert text.count(hardcoded) == 0
          workflow.write_text(text, 'utf-8')

          proof = {
              'status': 'PASS',
              'check': 'm3_max_parallel_control_plane',
              'request_run_id': req.get('run_id'),
              'requested_max_parallel': requested,
              'validated_request_bounds': '1..20',
              'plan_output_wired': True,
              'extract_strategy_uses_plan_output': True,
              'recover_strategy_uses_plan_output': True,
              'hardcoded_max_parallel_20_remaining': 0,
              'resolved_matrix_cap_for_current_request': requested,
              'raw_corpus_accessed': False,
              'feature_extraction_request_modified': False,
              'heavy_m3_triggered_by_this_patch': False,
              'verified_unix': time.time()
          }
          pathlib.Path('control/feature_concurrency_control_plane_check.json').write_text(
              json.dumps(proof, ensure_ascii=False, indent=2) + '\n', 'utf-8'
          )
          print(json.dumps(proof, ensure_ascii=False, indent=2))

      - name: Commit target workflow and proof to stage2 only
        run: |
          git config user.name 'osr-actions-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/workflows/osr-feature-extraction.yml control/feature_concurrency_control_plane_check.json
          git diff --cached --check
          git commit -m 'fix: honor M3 request max_parallel in extract and recover'
          git pull --rebase origin stage2-direct-miner-v3-1
          git push origin HEAD:stage2-direct-miner-v3-1
