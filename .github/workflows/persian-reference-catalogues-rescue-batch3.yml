name: Persian Reference Catalogues Rescue Batch 3
on:
  push:
    branches: [stage2-direct-miner-v3-1]
    paths: ['.github/workflows/persian-reference-catalogues-rescue-batch3.yml','control/persian_catalogue_rescue_targets_batch3.json','control/persian_catalogue_rescue_worker.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rescue:
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        target_id: [trinity_cambridge_palmer_1870, ouseley_persian_miscellanies_1795, specimens_persian_manuscripts_1902]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      RCLONE_CONFIG_B64: ${{ secrets.RCLONE_CONFIG_B64 }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.sha }}'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Configure
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check requests
          curl -fsSL https://rclone.org/install.sh | sudo bash
          mkdir -p "$HOME/.config/rclone"
          printf '%s' "$RCLONE_CONFIG_B64" | base64 -d > "$HOME/.config/rclone/rclone.conf"
          chmod 600 "$HOME/.config/rclone/rclone.conf"
      - name: Preserve ${{ matrix.target_id }}
        shell: bash
        run: |
          set -o pipefail
          mkdir -p result
          python control/persian_catalogue_rescue_worker.py --target-id '${{ matrix.target_id }}' --registry control/persian_catalogue_rescue_targets_batch3.json --work-dir "/tmp/catalogue-${{ matrix.target_id }}" 2>&1 | tee "result/${{ matrix.target_id }}.log"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: persian-catalogue-batch3-${{ matrix.target_id }}-${{ github.run_id }}
          path: result/
          retention-days: 30
