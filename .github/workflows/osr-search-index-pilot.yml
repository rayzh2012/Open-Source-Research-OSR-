name: OSR Search Index Pilot

on:
  push:
    branches:
      - stage2-direct-miner-v3-1
    paths:
      - control/search_index_pilot_request.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: osr-search-index-pilot
  cancel-in-progress: true

jobs:
  quickwit-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: stage2-direct-miner-v3-1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pilot dependencies
        run: python -m pip install --disable-pip-version-check pyarrow==21.0.0 requests==2.32.4 huggingface_hub==0.34.4

      - name: Validate request
        shell: python
        run: |
          import json
          req=json.load(open('control/search_index_pilot_request.json', encoding='utf-8'))
          assert req.get('action') == 'QUICKWIT_PILOT', req
          print(req)

      - name: Pull Quickwit 0.9.0
        run: docker pull quickwit/quickwit:0.9.0

      - name: Run two-corpus pilot
        env:
          OSR_PILOT_ROWS: '3000'
          OSR_PILOT_TEXT_BYTES: '100663296'
          OSR_PILOT_CHUNK_CHARS: '8192'
          OSR_PILOT_CHUNK_OVERLAP: '128'
        run: python tools/osr_search_index_pilot.py

      - name: Commit benchmark result
        if: always()
        run: |
          if [ ! -f control/search_index_pilot_result.json ]; then
            echo 'Pilot did not produce result JSON.' >&2
            exit 1
          fi
          git config user.name 'osr-actions-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add control/search_index_pilot_result.json
          if git diff --cached --quiet; then
            echo 'No result change to commit.'
          else
            git commit -m "OSR search index pilot result: $GITHUB_RUN_ID"
            git push origin HEAD:stage2-direct-miner-v3-1
          fi
