name: Discover Riedel 1886 Full View
on:
  pull_request:
    paths:
      - '.github/workflows/discover-riedel1886.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Query Google Books exact-title metadata
        shell: bash
        run: |
          set -u
          mkdir -p out
          q='De sluik-en kroesharige rassen tusschen Selebes en Papua Riedel 1886'
          curl -fL --retry 2 --get --data-urlencode "q=$q" --data-urlencode 'maxResults=40' 'https://www.googleapis.com/books/v1/volumes' -o out/google_books.json
          python - <<'PY' | tee out/candidates.txt
          import json
          d=json.load(open('out/google_books.json'))
          for item in d.get('items',[]):
              v=item.get('volumeInfo',{}); a=item.get('accessInfo',{})
              print('ID',item.get('id'))
              print('TITLE',v.get('title'))
              print('AUTHORS',v.get('authors'))
              print('DATE',v.get('publishedDate'),'PAGES',v.get('pageCount'))
              print('VIEW',a.get('viewability'),'PUBLIC',a.get('publicDomain'),'PDF',a.get('pdf'))
              print('WEB',a.get('webReaderLink'))
              print('---')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: riedel1886-discovery
          path: out/
          retention-days: 3
