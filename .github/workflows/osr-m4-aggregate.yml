name: OSR M4 Research Aggregation

on:
  workflow_run:
    workflows: ["OSR 508GB Feature Extraction"]
    types: [completed]
    branches: [stage2-direct-miner-v3-1]
  push:
    branches: [stage2-direct-miner-v3-1]
    paths:
      - control/m4_aggregation_request.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: osr-m4-aggregate
  cancel-in-progress: false

jobs:
  aggregate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage2-direct-miner-v3-1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Gate on strict resilient M3 PASS
        shell: python
        run: |
          import json, pathlib

          def load(path):
              p = pathlib.Path(path)
              if not p.exists():
                  raise SystemExit(f'missing required M3 control file: {path}')
              return json.load(open(p, encoding='utf-8'))

          req = load('control/feature_extraction_request.json')
          status = load('control/feature_extraction_status.json')
          catalog = load('control/feature_catalog.json')
          integrity = load('control/feature_release_integrity.json')

          run_id = req.get('run_id')
          partitions = int(req.get('partition_count', 128))
          expected_shards = 1788

          bad = {}
          expected_status = {
              'status': 'PASS',
              'run_id': run_id,
              'expected_partitions': partitions,
              'complete_partitions': partitions,
              'expected_shards': expected_shards,
              'shards_scanned': expected_shards,
              'missing_shards_count': 0,
          }
          for k, v in expected_status.items():
              if status.get(k) != v:
                  bad[f'status.{k}'] = {'expected': v, 'got': status.get(k)}

          expected_catalog = {
              'status': 'PASS',
              'run_id': run_id,
              'expected_shards': expected_shards,
              'shards_scanned': expected_shards,
          }
          for k, v in expected_catalog.items():
              if catalog.get(k) != v:
                  bad[f'catalog.{k}'] = {'expected': v, 'got': catalog.get(k)}

          expected_integrity = {
              'status': 'PASS',
              'run_id': run_id,
              'partition_count_expected': partitions,
              'partition_summaries_found': partitions,
              'source_shards_expected': expected_shards,
              'source_shards_found': expected_shards,
          }
          for k, v in expected_integrity.items():
              if integrity.get(k) != v:
                  bad[f'integrity.{k}'] = {'expected': v, 'got': integrity.get(k)}

          if bad:
              raise SystemExit(f'M3 resilient strict gate failed: {bad}')

          print(json.dumps({
              'status': 'M3_RESILIENT_GATE_PASS',
              'run_id': run_id,
              'partitions': partitions,
              'shards': expected_shards,
          }, ensure_ascii=False))
      - name: Build compact research aggregation
        run: python tools/osr_m4_aggregate_v1.py
      - name: Build and optionally send Notion writeback
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_PAGE_ID: ${{ secrets.NOTION_PAGE_ID }}
        run: python tools/osr_m3_m4_notion_writeback.py
      - name: Verify M4 input points to current M3 run
        shell: python
        run: |
          import json
          s=json.load(open('control/feature_extraction_status.json',encoding='utf-8'))
          a=json.load(open('control/research_aggregation_v1.json',encoding='utf-8'))
          if a.get('inputs',{}).get('feature_run_id') != s.get('run_id'):
              raise SystemExit('M4/M3 run-id mismatch')
          print({'status':'RUN_ID_MATCH','run_id':s.get('run_id')})
      - name: Commit M4 aggregation + writeback payload
        run: |
          git config user.name 'osr-actions-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add control/research_aggregation_v1.json control/m3_m4_notion_writeback.json
          git diff --cached --quiet && exit 0
          git commit -m 'm4: build research aggregation v1'
          git pull --rebase origin stage2-direct-miner-v3-1
          git push origin HEAD:stage2-direct-miner-v3-1
