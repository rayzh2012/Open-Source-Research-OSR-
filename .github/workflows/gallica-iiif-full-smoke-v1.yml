name: Gallica IIIF Full Preservation Smoke v1

on:
  push:
    branches: [stage2-direct-miner-v3-1]
    paths:
      - 'control/gallica_persian_pd_iiif_worker.py'
      - '.github/workflows/gallica-iiif-full-smoke-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rescue:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        ark: [btv1b10025022q, btv1b10025026h]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      RCLONE_CONFIG_B64: ${{ secrets.RCLONE_CONFIG_B64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Configure preservation environment
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check requests
          curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null
          mkdir -p "$HOME/.config/rclone"
          printf '%s' "$RCLONE_CONFIG_B64" | base64 -d > "$HOME/.config/rclone/rclone.conf"
          chmod 600 "$HOME/.config/rclone/rclone.conf"
          rclone listremotes | grep -qx 'gdrive:'
      - name: Preserve all IIIF pages
        shell: bash
        run: |
          set -o pipefail
          mkdir -p result
          python control/gallica_persian_pd_iiif_worker.py \
            --ark '${{ matrix.ark }}' \
            --work-dir '/tmp/gallica-iiif-${{ matrix.ark }}' \
            2>&1 | tee 'result/${{ matrix.ark }}.log'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gallica-iiif-full-smoke-${{ matrix.ark }}-${{ github.run_id }}
          path: result/
          retention-days: 30
