name: OSR Sketch Cache Pilot
on:
  push:
    branches: [stage2-direct-miner-v3-1]
    paths:
      - 'control/sketch_cache_pilot_request.json'
      - 'tools/osr_sketch_cache_pilot.py'
      - '.github/workflows/osr-sketch-cache-pilot.yml'
permissions:
  contents: write
jobs:
  pilot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage2-direct-miner-v3-1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pyarrow requests
      - name: Build bounded 4-shard samples
        run: |
          python - <<'PY'
          import json, requests, pyarrow.parquet as pq, pathlib, tempfile
          req=json.load(open('control/sketch_cache_pilot_request.json'))
          out=[]
          for item in req['shards']:
              url=item['url']
              b=requests.get(url, timeout=120).content
              p=tempfile.NamedTemporaryFile(suffix='.parquet',delete=False)
              p.write(b); p.close()
              pf=pq.ParquetFile(p.name)
              tab=pf.read_row_group(0, columns=['text']) if 'text' in pf.schema.names else pf.read_row_group(0)
              vals=[]
              col='text' if 'text' in tab.column_names else tab.column_names[0]
              for x in tab[col].to_pylist()[:req.get('rows_per_shard',120)]:
                  if x: vals.append(str(x))
              text='\n'.join(vals)[:req.get('max_chars_per_shard',2000000)]
              out.append({'file':item['file'],'text_sample':text})
          pathlib.Path('control/sketch_cache_pilot_input.jsonl').write_text('\n'.join(json.dumps(x,ensure_ascii=False) for x in out)+'\n','utf-8')
          PY
      - name: Run sketch pilot
        run: python tools/osr_sketch_cache_pilot.py --input-jsonl control/sketch_cache_pilot_input.jsonl --out control/sketch_cache_pilot_result.json
      - name: Commit result
        run: |
          git config user.name osr-actions-bot
          git config user.email actions@users.noreply.github.com
          git add control/sketch_cache_pilot_result.json
          git commit -m 'osr: record sketch cache pilot result' || exit 0
          git push
