name: Probe Google Books Hueting 1908
on:
  push:
    branches:
      - archive-hueting-1936-tobelo-grammar
    paths:
      - '.github/workflows/archive-hueting-1936.yml'
  pull_request:
    paths:
      - '.github/workflows/archive-hueting-1936.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Probe SearchWithinVolume endpoints
        shell: bash
        run: |
          set -u
          mkdir -p out
          ua='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36'
          urls=(
            'https://books.google.com/books?jscmd=SearchWithinVolume2&q=hohono&vid=U2VwYkm4NBsC'
            'https://books.google.com/books?vid=U2VwYkm4NBsC&jscmd=SearchWithinVolume2&q=hohono'
            'https://books.google.com/books?id=U2VwYkm4NBsC&jscmd=SearchWithinVolume2&q=hohono'
            'https://books.google.com/books?jscmd=SearchWithinVolume2&q=bohono&vid=U2VwYkm4NBsC'
            'https://www.googleapis.com/books/v1/volumes/U2VwYkm4NBsC'
          )
          : > out/results.tsv
          printf 'n\thttp\tctype\tsize\turl\n' > out/results.tsv
          n=0
          for url in "${urls[@]}"; do
            n=$((n+1)); body="out/body_${n}.txt"; hdr="out/headers_${n}.txt"
            code=$(curl -L -sS --connect-timeout 15 --max-time 90 -A "$ua" -H 'Accept-Language: en-US,en;q=0.8' -D "$hdr" -o "$body" -w '%{http_code}' "$url" || echo ERR)
            ctype=$(awk 'BEGIN{IGNORECASE=1}/^content-type:/{v=$0}END{sub(/^[^:]*:[ ]*/,"",v);gsub(/\r/,"",v);print v}' "$hdr")
            size=$(wc -c < "$body" 2>/dev/null || echo 0)
            printf '%s\t%s\t%s\t%s\t%s\n' "$n" "$code" "$ctype" "$size" "$url" >> out/results.tsv
            echo "--- BODY $n ---"
            head -c 12000 "$body" || true
            echo
          done
          cat out/results.tsv
      - uses: actions/upload-artifact@v4
        with:
          name: google-books-hueting-1908-probe
          path: out/
          compression-level: 0
          retention-days: 7
