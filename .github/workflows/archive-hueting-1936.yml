name: Archive Tobelo Morphology Controls
on:
  push:
    branches:
      - archive-hueting-1936-tobelo-grammar
    paths:
      - '.github/workflows/archive-hueting-1936.yml'
  pull_request:
    paths:
      - '.github/workflows/archive-hueting-1936.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Tobelo morphology controls
        shell: bash
        run: |
          set -u
          mkdir -p downloads
          : > downloads/RESULTS.tsv
          printf 'source\tstatus\tfilename\tsize\tsha256\n' > downloads/RESULTS.tsv
          fetch_pdf() {
            source="$1"; url="$2"; out="$3"
            if curl -fL --retry 2 --retry-delay 2 --connect-timeout 20 --max-time 300 \
              -A 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36' \
              -H 'Accept: application/pdf,application/octet-stream;q=0.9,*/*;q=0.8' \
              "$url" -o "$out" && test "$(head -c 5 "$out")" = '%PDF-'; then
              size=$(stat -c '%s' "$out")
              sha=$(sha256sum "$out" | awk '{print $1}')
              printf '%s\tOK_PDF\t%s\t%s\t%s\n' "$source" "$(basename "$out")" "$size" "$sha" >> downloads/RESULTS.tsv
            else
              rm -f "$out"
              printf '%s\tDOWNLOAD_FAILED\t%s\t\t\n' "$source" "$(basename "$out")" >> downloads/RESULTS.tsv
            fi
          }
          fetch_pdf hueting_1936 'https://brill.com/downloadpdf/journals/bki/94/1/article-p295_9.pdf' 'downloads/1936_Hueting_Iets_over_de_spraakkunst_van_de_Tobeloreesche_taal.pdf'
          fetch_pdf holton_2006 'https://sil-philippines-languages.org/ical/papers/holton-tobelo.pdf' 'downloads/2006_Holton_The_relational_noun_marker_in_Tobelo.pdf'
          cat downloads/RESULTS.tsv
      - uses: actions/upload-artifact@v4
        with:
          name: tobelo-morphology-controls
          path: downloads/
          compression-level: 0
          retention-days: 7
