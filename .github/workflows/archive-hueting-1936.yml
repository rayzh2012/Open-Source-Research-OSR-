name: Map UGM Neighbor Collections
on:
  push:
    branches:
      - archive-hueting-1936-tobelo-grammar
    paths:
      - '.github/workflows/archive-hueting-1936.yml'
  pull_request:
    paths:
      - '.github/workflows/archive-hueting-1936.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Map viewer IDs around 675 v2
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          base='https://langka.lib.ugm.ac.id'
          ua='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36'
          printf 'viewer_id\thttp\ttitle\tserver_filename\tbytes\n' > out/RESULTS.tsv
          for id in $(seq 650 710); do
            jar="out/cookie_${id}.txt"; html="out/viewer_${id}.html"
            code=$(curl -L -sS -c "$jar" -b "$jar" --connect-timeout 10 --max-time 30 -A "$ua" "$base/viewer/index/$id" -o "$html" -w '%{http_code}' || true)
            title=$(python - "$html" <<'PY'
import re,sys,html as h,os
p=sys.argv[1]
s=open(p,encoding='utf-8',errors='ignore').read() if os.path.exists(p) else ''
m=re.search(r'<div class="metadata[^>]*>.*?<h3>(.*?)</h3>',s,re.S|re.I)
t=re.sub('<[^>]+>',' ',m.group(1)) if m else ''
print(' '.join(h.unescape(t).split()))
PY
)
            sf=''; bytes=''
            if [ "$code" = 200 ] && printf '%s' "$title" | grep -qi 'Tobeloreesch-Hollandsch'; then
              curl -sS -L -c "$jar" -b "$jar" -A "$ua" -e "$base/viewer/index/$id" -X POST "$base/viewer/validate_page" -o /dev/null || true
              curl -sS -L -c "$jar" -b "$jar" -A "$ua" -e "$base/viewer/index/$id" "$base/koleksi/buku/download_file/" -D "out/download_${id}.headers" -o "out/file_${id}.bin" || true
              sf=$(sed -n 's/^[Cc]ontent-[Dd]isposition:.*filename=\([^;\r]*\).*/\1/p' "out/download_${id}.headers" | tail -1 | tr -d '\r\"' || true)
              bytes=$(wc -c < "out/file_${id}.bin" 2>/dev/null || echo 0)
            fi
            printf '%s\t%s\t%s\t%s\t%s\n' "$id" "$code" "$title" "$sf" "$bytes" >> out/RESULTS.tsv
          done
          cat out/RESULTS.tsv
      - uses: actions/upload-artifact@v4
        with:
          name: ugm-neighbor-map
          path: out/RESULTS.tsv
          retention-days: 7
