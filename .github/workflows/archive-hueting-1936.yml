name: Probe UGM Hueting 1908
on:
  push:
    branches:
      - archive-hueting-1936-tobelo-grammar
    paths:
      - '.github/workflows/archive-hueting-1936.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Probe collection 675 media paths
        shell: bash
        run: |
          set -u
          mkdir -p probe
          : > probe/RESULTS.tsv
          printf 'url\thttp\tcontent_type\tsize\tmagic\n' > probe/RESULTS.tsv
          base='https://langka.lib.ugm.ac.id'
          candidates=(
            '/public/upload/pdf/675.pdf'
            '/public/upload/pdf/675.PDF'
            '/public/upload/pdf/675/675.pdf'
            '/public/upload/675.pdf'
            '/public/upload/doc/675.pdf'
            '/public/upload/document/675.pdf'
            '/public/upload/ebook/675.pdf'
            '/public/upload/file/675.pdf'
            '/public/upload/files/675.pdf'
            '/public/pdf/675.pdf'
            '/upload/pdf/675.pdf'
            '/assets/pdf/675.pdf'
            '/public/pdfjs/web/viewer.html?file=/public/upload/pdf/675.pdf'
          )
          i=0
          for path in "${candidates[@]}"; do
            i=$((i+1)); url="$base$path"; out="probe/candidate_$i.bin"; hdr="probe/candidate_$i.headers"
            code=$(curl -L -sS --connect-timeout 10 --max-time 25 -A 'Mozilla/5.0' -D "$hdr" -o "$out" -w '%{http_code}' "$url" || echo ERR)
            ctype=$(awk 'BEGIN{IGNORECASE=1}/^content-type:/{v=$0}END{sub(/^[^:]*:[ ]*/,"",v);gsub(/\r/,"",v);print v}' "$hdr")
            size=$(wc -c < "$out" 2>/dev/null || echo 0)
            magic=$(head -c 8 "$out" 2>/dev/null | xxd -p -c 8 || true)
            printf '%s\t%s\t%s\t%s\t%s\n' "$url" "$code" "$ctype" "$size" "$magic" >> probe/RESULTS.tsv
            if head -c 5 "$out" 2>/dev/null | grep -q '%PDF-'; then cp "$out" probe/Hueting1908_UGM_675.pdf; fi
          done
          cat probe/RESULTS.tsv
      - uses: actions/upload-artifact@v4
        with:
          name: ugm-hueting-1908-probe
          path: probe/
          compression-level: 0
          retention-days: 7
