name: Probe UGM Sequential Slices
on:
  push:
    branches:
      - archive-hueting-1936-tobelo-grammar
    paths:
      - '.github/workflows/archive-hueting-1936.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Test repeated validate-download sequence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          base='https://langka.lib.ugm.ac.id'
          viewer="$base/viewer/index/675"
          ua='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36'
          curl -fL -c out/cookies.txt -b out/cookies.txt --connect-timeout 20 --max-time 120 -A "$ua" "$viewer" -o out/viewer_675.html
          printf 'iteration\thttp\tserver_filename\tbytes\tpages\tsha256\n' > out/RESULTS.tsv
          for i in $(seq 1 12); do
            curl -sS -L -c out/cookies.txt -b out/cookies.txt -A "$ua" -e "$viewer" -X POST "$base/viewer/validate_page" -D "out/validate_${i}.headers" -o "out/validate_${i}.body" || true
            code=$(curl -sS -L -c out/cookies.txt -b out/cookies.txt -A "$ua" -e "$viewer" "$base/koleksi/buku/download_file/" -D "out/download_${i}.headers" -o "out/chunk_${i}.bin" -w '%{http_code}' || true)
            sf=$(sed -n 's/^[Cc]ontent-[Dd]isposition:.*filename=\([^;\r]*\).*/\1/p' "out/download_${i}.headers" | tail -1 | tr -d '\r\"' || true)
            bytes=$(wc -c < "out/chunk_${i}.bin" 2>/dev/null || echo 0)
            if head -c 5 "out/chunk_${i}.bin" | grep -q '%PDF-'; then
              mv "out/chunk_${i}.bin" "out/chunk_${i}.pdf"
              pages=$(pdfinfo "out/chunk_${i}.pdf" 2>/dev/null | awk '/^Pages:/{print $2}' || true)
              sha=$(sha256sum "out/chunk_${i}.pdf" | awk '{print $1}')
            else
              pages=''; sha=''
            fi
            printf '%s\t%s\t%s\t%s\t%s\t%s\n' "$i" "$code" "$sf" "$bytes" "$pages" "$sha" >> out/RESULTS.tsv
          done
          cat out/RESULTS.tsv
      - uses: actions/upload-artifact@v4
        with:
          name: ugm-sequential-slices
          path: out/
          compression-level: 0
          retention-days: 7
