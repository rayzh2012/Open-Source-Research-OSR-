name: Tobelo Taboo Source Breakers
on:
  push:
    branches:
      - archive-hueting-1936-tobelo-grammar
    paths:
      - '.github/workflows/archive-hueting-1936.yml'
  pull_request:
    paths:
      - '.github/workflows/archive-hueting-1936.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Query HathiTrust and archive Kern 1893
        shell: bash
        run: |
          set -u
          mkdir -p out
          ua='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36'
          hathi='https://catalog.hathitrust.org/api/volumes/brief/oclc/7420160.json'
          curl -sS -L --connect-timeout 20 --max-time 120 -A "$ua" -D out/hathi.headers "$hathi" -o out/hathi_7420160.json || true
          echo '--- HATHI ---'
          cat out/hathi_7420160.json || true
          echo
          kern='https://brill.com/view/journals/bki/42/1/article-p120_11.pdf'
          if curl -fL --retry 2 --retry-delay 2 --connect-timeout 20 --max-time 300 -A "$ua" -H 'Accept: application/pdf,*/*;q=0.8' "$kern" -o out/1893_Kern_Woordverwisseling_in_het_Galelareesch.pdf && test "$(head -c 5 out/1893_Kern_Woordverwisseling_in_het_Galelareesch.pdf)" = '%PDF-'; then
            echo 'KERN_OK'
            file out/1893_Kern_Woordverwisseling_in_het_Galelareesch.pdf
            wc -c out/1893_Kern_Woordverwisseling_in_het_Galelareesch.pdf
            sha256sum out/1893_Kern_Woordverwisseling_in_het_Galelareesch.pdf | tee out/KERN_SHA256.txt
            pdftotext -layout out/1893_Kern_Woordverwisseling_in_het_Galelareesch.pdf out/kern1893.txt || true
            grep -in -E 'saali|Tob[eè]lo|Loloda|vervang|naam|klank' out/kern1893.txt | head -100 | tee out/kern_hits.txt || true
          else
            echo 'KERN_DOWNLOAD_FAILED' | tee out/KERN_STATUS.txt
            rm -f out/1893_Kern_Woordverwisseling_in_het_Galelareesch.pdf
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: tobelo-taboo-source-breakers
          path: out/
          compression-level: 0
          retention-days: 7
