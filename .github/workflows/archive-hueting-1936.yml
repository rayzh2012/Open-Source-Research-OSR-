name: Tobelo Taboo Source Breakers
on:
  push:
    branches:
      - archive-hueting-1936-tobelo-grammar
    paths:
      - '.github/workflows/archive-hueting-1936.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: archive-hueting-1936-tobelo-grammar
      - name: Resolve Hueting 1908 HathiTrust item and probe Kern 1893
        shell: bash
        run: |
          set -u
          mkdir -p research_tmp
          ua='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36'
          for endpoint in \
            'https://catalog.hathitrust.org/api/volumes/brief/recordnumber/006298806.json' \
            'https://catalog.hathitrust.org/api/volumes/brief/oclc/7420160.json' \
            'https://catalog.hathitrust.org/api/volumes/brief/lccn/09024063.json'; do
            name=$(printf '%s' "$endpoint" | sed 's#https://catalog.hathitrust.org/api/volumes/brief/##;s#[/.]#_#g')
            curl -sS -L --connect-timeout 20 --max-time 120 -A "$ua" "$endpoint" -o "research_tmp/hathi_${name}.json" || true
          done
          python - <<'PY' > research_tmp/HATHI_SUMMARY.txt
import glob,json
for p in sorted(glob.glob('research_tmp/hathi_*.json')):
    print('\nFILE',p)
    try:
      d=json.load(open(p))
    except Exception as e:
      print('PARSE_ERROR',e); continue
    print('records=', list(d.get('records',{})))
    for it in d.get('items',[]):
      print('ITEM', {k:it.get(k) for k in ('htid','orig','itemURL','rightsCode','usRightsString','fromRecord','enumcron')})
PY
          cat research_tmp/HATHI_SUMMARY.txt
          kern='https://brill.com/view/journals/bki/42/1/article-p120_11.pdf'
          code=$(curl -L -sS --connect-timeout 20 --max-time 180 -A "$ua" -o research_tmp/kern1893.bin -w '%{http_code}' "$kern" || true)
          printf 'http=%s\n' "$code" > research_tmp/KERN_STATUS.txt
          file research_tmp/kern1893.bin >> research_tmp/KERN_STATUS.txt 2>&1 || true
          wc -c research_tmp/kern1893.bin >> research_tmp/KERN_STATUS.txt 2>&1 || true
          if head -c 5 research_tmp/kern1893.bin 2>/dev/null | grep -q '%PDF-'; then
            mv research_tmp/kern1893.bin research_tmp/1893_Kern_Woordverwisseling_in_het_Galelareesch.pdf
            sha256sum research_tmp/1893_Kern_Woordverwisseling_in_het_Galelareesch.pdf >> research_tmp/KERN_STATUS.txt
          else
            rm -f research_tmp/kern1893.bin
          fi
      - name: Commit probe outputs to branch
        shell: bash
        run: |
          git config user.name 'research-archive-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add research_tmp/
          git diff --cached --quiet && exit 0
          git commit -m 'research: persist Hathi/Kern source probe results'
          git push origin HEAD:archive-hueting-1936-tobelo-grammar
