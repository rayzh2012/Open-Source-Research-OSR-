name: Inspect UGM Hueting 1908 Viewer
on:
  push:
    branches:
      - archive-hueting-1936-tobelo-grammar
    paths:
      - '.github/workflows/archive-hueting-1936.yml'
  pull_request:
    paths:
      - '.github/workflows/archive-hueting-1936.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch raw viewer HTML and inspect embedded media
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p inspect
          url='https://langka.lib.ugm.ac.id/viewer/index/675'
          curl -fL --connect-timeout 20 --max-time 120 -A 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36' "$url" -o inspect/viewer_675.html
          printf '%s\n' '--- MEDIA / IFRAME / SCRIPT LINES ---'
          grep -Ein 'iframe|pdf|upload|koleksi|document|embed|object|src=|file=|viewer' inspect/viewer_675.html | tee inspect/relevant_lines.txt || true
          printf '%s\n' '--- URLS ---'
          grep -Eo 'https?://[^"'"'<> ]+' inspect/viewer_675.html | sort -u | tee inspect/urls.txt || true
          printf '%s\n' '--- HTML SIZE ---'
          wc -c inspect/viewer_675.html
      - uses: actions/upload-artifact@v4
        with:
          name: ugm-hueting-1908-viewer-html
          path: inspect/
          compression-level: 0
          retention-days: 7
