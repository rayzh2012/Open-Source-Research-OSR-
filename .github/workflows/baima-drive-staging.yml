name: Baima Dictionary Drive Staging

on:
  push:
    paths:
      - '.github/workflows/baima-drive-staging.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PDF: "Baima_Han_Dacidian_9787226052457.pdf"

    steps:
      - name: Install split tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends poppler-utils qpdf >/dev/null

      - name: Reuse preserved source artifact
        uses: actions/download-artifact@v4
        with:
          name: baima-han-dacidian-9787226052457
          path: source
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 34016579330

      - name: Validate source PDF
        shell: bash
        run: |
          set -euo pipefail
          src=$(find source -type f -name '*.pdf' | head -1)
          test -n "$src"
          cp "$src" "$PDF"
          test "$(head -c 5 "$PDF")" = "%PDF-"
          sha256sum "$PDF" | tee SOURCE_SHA256SUMS.txt
          pdfinfo "$PDF" | tee PDFINFO.txt
          test "$(pdfinfo "$PDF" | awk '/^Pages:/ {print $2}')" = "941"

      - name: Extract embedded text layer
        run: |
          mkdir -p staging/text staging/pdf
          pdftotext -layout "$PDF" staging/text/Baima_Han_Dacidian_embedded_text.txt
          wc -c staging/text/Baima_Han_Dacidian_embedded_text.txt | tee staging/text/TEXT_BYTES.txt
          cp PDFINFO.txt SOURCE_SHA256SUMS.txt staging/text/

      - name: Split PDF into Drive-safe volumes
        run: |
          qpdf "$PDF" --pages "$PDF" 1-200 -- staging/pdf/Baima_Han_Dacidian_P001-200.pdf
          qpdf "$PDF" --pages "$PDF" 201-400 -- staging/pdf/Baima_Han_Dacidian_P201-400.pdf
          qpdf "$PDF" --pages "$PDF" 401-600 -- staging/pdf/Baima_Han_Dacidian_P401-600.pdf
          qpdf "$PDF" --pages "$PDF" 601-800 -- staging/pdf/Baima_Han_Dacidian_P601-800.pdf
          qpdf "$PDF" --pages "$PDF" 801-941 -- staging/pdf/Baima_Han_Dacidian_P801-941.pdf
          sha256sum staging/pdf/*.pdf | tee staging/pdf/SPLIT_SHA256SUMS.txt
          ls -lh staging/pdf/*.pdf

      - name: Upload text layer
        uses: actions/upload-artifact@v4
        with:
          name: baima-text-layer
          path: staging/text/
          compression-level: 6
          retention-days: 7

      - name: Upload volume 001-200
        uses: actions/upload-artifact@v4
        with:
          name: baima-pdf-001-200
          path: staging/pdf/Baima_Han_Dacidian_P001-200.pdf
          compression-level: 0
          retention-days: 7

      - name: Upload volume 201-400
        uses: actions/upload-artifact@v4
        with:
          name: baima-pdf-201-400
          path: staging/pdf/Baima_Han_Dacidian_P201-400.pdf
          compression-level: 0
          retention-days: 7

      - name: Upload volume 401-600
        uses: actions/upload-artifact@v4
        with:
          name: baima-pdf-401-600
          path: staging/pdf/Baima_Han_Dacidian_P401-600.pdf
          compression-level: 0
          retention-days: 7

      - name: Upload volume 601-800
        uses: actions/upload-artifact@v4
        with:
          name: baima-pdf-601-800
          path: staging/pdf/Baima_Han_Dacidian_P601-800.pdf
          compression-level: 0
          retention-days: 7

      - name: Upload volume 801-941
        uses: actions/upload-artifact@v4
        with:
          name: baima-pdf-801-941
          path: staging/pdf/Baima_Han_Dacidian_P801-941.pdf
          compression-level: 0
          retention-days: 7
