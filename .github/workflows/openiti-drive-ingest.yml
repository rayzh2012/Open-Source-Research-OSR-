name: OpenITI 5.9GB to Drive

on:
  push:
    branches:
      - stage2-direct-miner-v3-1
    paths:
      - '.github/workflows/openiti-drive-ingest.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openiti-drive-ingest
  cancel-in-progress: false

jobs:
  auth:
    runs-on: ubuntu-latest
    env:
      RCLONE_CONFIG_B64: ${{ secrets.RCLONE_CONFIG_B64 }}
    steps:
      - name: Verify Drive secret
        run: test -n "${RCLONE_CONFIG_B64:-}" || { echo '::error::Missing RCLONE_CONFIG_B64'; exit 42; }

  ingest:
    needs: auth
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      RCLONE_CONFIG_B64: ${{ secrets.RCLONE_CONFIG_B64 }}
      DEST: "gdrive:龍族古籍源庫｜Dragon Source Corpus/OPEN_CURATED_CORPORA/openiti/2025.1.9"
    steps:
      - name: Install rclone and configure Drive
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://rclone.org/install.sh | sudo bash
          mkdir -p "$HOME/.config/rclone"
          printf '%s' "$RCLONE_CONFIG_B64" | base64 -d > "$HOME/.config/rclone/rclone.conf"
          chmod 600 "$HOME/.config/rclone/rclone.conf"
          rclone listremotes | grep -qx 'gdrive:'
      - name: Download and archive OpenITI release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          DATA_URL='https://zenodo.org/records/17767721/files/OpenITI_data_2025-1-9.zip?download=1'
          META_URL='https://zenodo.org/records/17767721/files/OpenITI_metadata_2025-1-9.tsv?download=1'
          NOTES_URL='https://zenodo.org/records/17767721/files/OpenITI_release-notes_2025-1-9.zip?download=1'
          DATA_MD5='95cf19a9320fee6c37c4c26c9fa860b1'
          META_MD5='cb2226f64264efa964df9ef659d40199'
          NOTES_MD5='e127a3fccd2df033a6462542820f55a0'

          if rclone cat "$DEST/meta/COMPLETE.md5" >/tmp/complete 2>/dev/null && grep -q "$DATA_MD5" /tmp/complete; then
            echo 'OpenITI 2025.1.9 already archived; skipping.'
            exit 0
          fi

          curl -fL --retry 8 --retry-all-errors --connect-timeout 30 --speed-time 120 --speed-limit 10240 \
            "$META_URL" -o out/OpenITI_metadata_2025-1-9.tsv
          curl -fL --retry 8 --retry-all-errors --connect-timeout 30 --speed-time 120 --speed-limit 10240 \
            "$NOTES_URL" -o out/OpenITI_release-notes_2025-1-9.zip
          curl -fL --retry 8 --retry-all-errors --connect-timeout 30 --speed-time 120 --speed-limit 10240 \
            "$DATA_URL" -o out/OpenITI_data_2025-1-9.zip

          echo "$DATA_MD5  out/OpenITI_data_2025-1-9.zip" | md5sum -c -
          echo "$META_MD5  out/OpenITI_metadata_2025-1-9.tsv" | md5sum -c -
          echo "$NOTES_MD5  out/OpenITI_release-notes_2025-1-9.zip" | md5sum -c -

          DATA_SHA=$(sha256sum out/OpenITI_data_2025-1-9.zip | awk '{print $1}')
          META_SHA=$(sha256sum out/OpenITI_metadata_2025-1-9.tsv | awk '{print $1}')
          NOTES_SHA=$(sha256sum out/OpenITI_release-notes_2025-1-9.zip | awk '{print $1}')
          DATA_BYTES=$(stat -c%s out/OpenITI_data_2025-1-9.zip)

          cat > out/SOURCE.json <<JSON
          {
            "schema_version": "osr-openiti-source-v1",
            "dataset": "OpenITI",
            "version": "2025.1.9",
            "zenodo_record": "17767721",
            "doi": "10.5281/zenodo.17767721",
            "license": "CC-BY-NC-SA-4.0",
            "data_bytes": $DATA_BYTES,
            "data_md5": "$DATA_MD5",
            "data_sha256": "$DATA_SHA",
            "metadata_md5": "$META_MD5",
            "metadata_sha256": "$META_SHA",
            "release_notes_md5": "$NOTES_MD5",
            "release_notes_sha256": "$NOTES_SHA",
            "archive_policy": "raw immutable release; normalize in a separate feature-ready stage"
          }
          JSON

          rclone copyto out/OpenITI_data_2025-1-9.zip "$DEST/raw/OpenITI_data_2025-1-9.zip" --drive-chunk-size 64M --retries 8 --low-level-retries 16 --stats 30s
          rclone copyto out/OpenITI_metadata_2025-1-9.tsv "$DEST/meta/OpenITI_metadata_2025-1-9.tsv"
          rclone copyto out/OpenITI_release-notes_2025-1-9.zip "$DEST/meta/OpenITI_release-notes_2025-1-9.zip"
          rclone copyto out/SOURCE.json "$DEST/meta/SOURCE.json"
          printf '%s  OpenITI_data_2025-1-9.zip\n%s  OpenITI_metadata_2025-1-9.tsv\n%s  OpenITI_release-notes_2025-1-9.zip\n' \
            "$DATA_MD5" "$META_MD5" "$NOTES_MD5" > out/COMPLETE.md5
          # Completion marker last.
          rclone copyto out/COMPLETE.md5 "$DEST/meta/COMPLETE.md5"
