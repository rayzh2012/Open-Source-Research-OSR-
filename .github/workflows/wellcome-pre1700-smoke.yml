name: Wellcome Pre-1700 Public Domain Manuscript Smoke

on:
  push:
    branches: [stage2-direct-miner-v3-1]
    paths:
      - 'control/wellcome_pre1700_rescue_request.json'
      - 'control/wellcome_pre1700_smoke.py'
      - '.github/workflows/wellcome-pre1700-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      RCLONE_CONFIG_B64: ${{ secrets.RCLONE_CONFIG_B64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Configure preservation environment
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check requests
          curl -fsSL https://rclone.org/install.sh | sudo bash
          mkdir -p "$HOME/.config/rclone"
          printf '%s' "$RCLONE_CONFIG_B64" | base64 -d > "$HOME/.config/rclone/rclone.conf"
          chmod 600 "$HOME/.config/rclone/rclone.conf"
          rclone listremotes | grep -qx 'gdrive:'
      - name: Run Wellcome pre-1700 PDM smoke
        shell: bash
        run: |
          set -o pipefail
          mkdir -p result
          python control/wellcome_pre1700_smoke.py /tmp/wellcome-pre1700 2>&1 | tee result/smoke.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wellcome-pre1700-smoke-${{ github.run_id }}
          path: result/
          retention-days: 30
          if-no-files-found: warn
