name: Archive Fetch Bridge
on:
  push:
    paths:
      - '.github/workflows/archive-fetch.yml'
  pull_request:
    paths:
      - '.github/workflows/archive-fetch.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Target Hueting 1908 p.167 via Google Books
        shell: bash
        run: |
          set -u
          mkdir -p out
          ua='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36'
          id='U2VwYkm4NBsC'

          terms=(
            'hohono'
            'vervangwoorden'
            'vervangwoord'
            'aangetrouwde'
            'schoonvader'
            'schoonouders'
            'namen'
            'naam'
            'verboden'
            'mogen gebruiken'
            'gewoon gebruikelijke woord'
            'verwisselen'
            'woordverwisseling'
          )
          : > out/search-matrix.tsv
          printf 'term\thttp\tresults\tbody\n' > out/search-matrix.tsv
          i=0
          for term in "${terms[@]}"; do
            i=$((i+1))
            enc=$(python3 -c 'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))' "$term")
            url="https://books.google.com/books?id=$id&jscmd=SearchWithinVolume2&q=$enc"
            body="out/search_${i}.json"
            code=$(curl -L -sS --connect-timeout 15 --max-time 90 -A "$ua" -H 'Accept-Language: en-US,en;q=0.8' -o "$body" -w '%{http_code}' "$url" || echo ERR)
            nr=$(python3 - "$body" <<'PY'
import json,sys
try:
    print(json.load(open(sys.argv[1])).get('number_of_results',''))
except Exception:
    print('')
PY
)
            printf '%s\t%s\t%s\t%s\n' "$term" "$code" "$nr" "$body" >> out/search-matrix.tsv
            echo "=== TERM: $term ==="
            cat "$body" || true
            echo
          done

          # Directly inspect the page named by the later citation.
          for suffix in \
            "books?id=$id&pg=PA167" \
            "books?id=$id&pg=PA167&vq=hohono" \
            "books?id=$id&pg=PA167&dq=hohono" \
            "books?id=$id&pg=PA167&jscmd=SearchWithinVolume2&q=hohono"; do
            n=$(echo "$suffix" | sha256sum | cut -c1-10)
            curl -L -sS --connect-timeout 15 --max-time 90 -A "$ua" -H 'Accept-Language: en-US,en;q=0.8' \
              -D "out/page_${n}.headers" -o "out/page_${n}.html" "https://books.google.com/$suffix" || true
            echo "=== DIRECT PAGE $suffix ==="
            grep -Eio '.{0,180}(PA167|hohono|vervang|schoon|aangetrouw|books/content|pageImage|page_image|viewport).{0,300}' "out/page_${n}.html" | head -n 120 || true
          done

          # Probe common legacy page-image URL without guessing success.
          for zoom in 1 2 3; do
            url="https://books.google.com/books/content?id=$id&pg=PA167&img=1&zoom=$zoom&hl=en"
            outp="out/PA167_zoom${zoom}.bin"
            code=$(curl -L -sS --connect-timeout 15 --max-time 90 -A "$ua" -D "out/PA167_zoom${zoom}.headers" -o "$outp" -w '%{http_code}' "$url" || echo ERR)
            echo "PAGE_IMAGE zoom=$zoom http=$code size=$(wc -c < "$outp" 2>/dev/null || echo 0) mime=$(file -b --mime-type "$outp" 2>/dev/null || true)"
          done
          cat out/search-matrix.tsv
      - uses: actions/upload-artifact@v4
        with:
          name: hueting-1908-p167-google-books-probe
          path: out/
          compression-level: 0
          retention-days: 7
