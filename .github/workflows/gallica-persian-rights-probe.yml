name: Gallica Persian Rights Probe

on:
  push:
    branches: [stage2-direct-miner-v3-1]
    paths: ['.github/workflows/gallica-persian-rights-probe.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rights:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Query Gallica Categories facets
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import urllib.parse, urllib.request, json
          q='((dc.language all "per") or (dc.language all "fas")) and (dc.type all "manuscrit")'
          url='https://gallica.bnf.fr/services/Categories?'+urllib.parse.urlencode({'SRU':q})
          req=urllib.request.Request(url,headers={'User-Agent':'OSR-Preservation/1.0','Accept':'application/json'})
          with urllib.request.urlopen(req,timeout=90) as r: data=r.read()
          print('HTTP_BYTES='+str(len(data)))
          obj=json.loads(data)
          print(json.dumps(obj,ensure_ascii=False,indent=2)[:100000])
          PY
