name: OSR Stage-2 Smoke

on:
  push:
    branches:
      - stage2-direct-miner-v3-1
    paths:
      - control/stage2_action_request.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: osr-stage2-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: stage2-direct-miner-v3-1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install minimal dependencies
        run: python -m pip install --disable-pip-version-check pyarrow==21.0.0 requests==2.32.4

      - name: Validate request is smoke-only
        shell: python
        run: |
          import json
          p='control/stage2_action_request.json'
          x=json.load(open(p, encoding='utf-8'))
          assert x.get('action') == 'SMOKE_ONE_SHARD', x
          print(x)

      - name: Run one-shard HF smoke
        run: python tools/osr_actions_smoke.py

      - name: Commit result back to control plane
        run: |
          git config user.name 'osr-actions-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add control/stage2_smoke_result.json
          if git diff --cached --quiet; then
            echo 'No result change to commit.'
          else
            git commit -m 'OSR smoke result: ${{ github.run_id }}'
            git push origin HEAD:stage2-direct-miner-v3-1
          fi
