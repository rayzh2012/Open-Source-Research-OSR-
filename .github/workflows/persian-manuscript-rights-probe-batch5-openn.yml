name: Persian Manuscript Rights Probe Batch 5 OPenn

on:
  push:
    branches: [stage2-direct-miner-v3-1]
    paths: ['.github/workflows/persian-manuscript-rights-probe-batch5-openn.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Probe high-value licensed Persian manuscript originals
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,urllib.request
          ids=[
            'ljs189','ljs404','ljs295','ljs400','bv_051','kcajs_rar_ms207',
            'lewis_o_050','lewis_o_053','lewis_o_054','lewis_o_047',
            'MaktubatSirhindi-Vol1-Manuscript','PanjGanjByShaykhYaqoubSarfi-Manuscript'
          ]
          rows=[]
          for iid in ids:
            req=urllib.request.Request('https://archive.org/metadata/'+iid,headers={'User-Agent':'OSR-Preservation/1.0'})
            try:
              with urllib.request.urlopen(req,timeout=90) as r:o=json.load(r)
            except Exception as e:
              rows.append({'id':iid,'status':'ERROR','error':str(e)});continue
            m=o.get('metadata') or {}; originals=[]; total=0
            for f in o.get('files',[]):
              n=f.get('name','');src=f.get('source');size=int(f.get('size') or 0);fmt=f.get('format','')
              if src=='original' and n.lower().endswith(('.pdf','.tif','.tiff','.jpg','.jpeg','.jp2.zip','.xml')):
                originals.append({'name':n,'format':fmt,'size':size,'md5':f.get('md5'),'sha1':f.get('sha1')});total+=size
            rows.append({'id':iid,'status':'PASS','title':m.get('title'),'date':m.get('date'),'creator':m.get('creator'),'collection':m.get('collection'),'licenseurl':m.get('licenseurl'),'rights':m.get('rights'),'original_bytes':total,'originals':originals})
          print('RESULT_JSON='+json.dumps(rows,ensure_ascii=False,sort_keys=True))
          PY
