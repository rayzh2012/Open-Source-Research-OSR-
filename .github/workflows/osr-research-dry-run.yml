name: OSR Research DRY RUN

on:
  workflow_dispatch:
    inputs:
      request_path:
        description: 'Request JSON path to validate without corpus download or branch writes'
        required: true
        default: 'control/m5_exact_evidence_request.json'
        type: string
      allow_existing_run:
        description: 'Allow a run_id whose archive already exists'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage2-direct-miner-v3-1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate request / router / bounds / archive target
        env:
          REQUEST_PATH: ${{ inputs.request_path }}
          ALLOW_EXISTING: ${{ inputs.allow_existing_run }}
        run: |
          if [ "$ALLOW_EXISTING" = "true" ]; then
            python tools/osr_research_preflight.py --request "$REQUEST_PATH" --allow-existing-run
          else
            python tools/osr_research_preflight.py --request "$REQUEST_PATH"
          fi
      - name: Assert dry-run contract
        run: |
          echo 'DRY RUN contract: no Hugging Face corpus download; no Notion write; no branch write; no paid/larger/GPU runner.'
