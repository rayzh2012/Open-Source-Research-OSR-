name: Fetch Yin Xu Bu Ci Zong Lei PDF

on:
  push:
    paths:
      - '.github/workflows/fetch-yinxu-buci-zongshu.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOURCE_URL: 'https://wtgadtq.org/d4/X/69af6XS/f/1789021442/50000/g4/libgenrs_nonfiction/libgenrs_nonfiction/3435000/6f0b2dd4c01b73cec8a6b0b2cc92602f~/LmvkAILTHl3KEjqj66xgRw/%E6%AE%B7%E5%A2%9F%E5%8D%9C%E8%BE%9E%E7%BB%BC%E7%B1%BB%20--%20%E5%B2%9B%E9%82%A6%E7%94%B7%20--%201977%20--%20%E6%B1%B2%E5%8F%A4%E4%B9%A6%E9%99%A2%20--%206f0b2dd4c01b73cec8a6b0b2cc92602f%20--%20Anna%E2%80%99s%20Archive.pdf'
      PDF: '殷墟卜辞综类_岛邦男_1977.pdf'
    steps:
      - name: Download source PDF
        run: |
          set -euo pipefail
          curl -fL --retry 5 --retry-all-errors --retry-delay 2 \
            --connect-timeout 30 --max-time 1500 \
            -A 'Mozilla/5.0' \
            "$SOURCE_URL" -o "$PDF"
          test "$(head -c 5 "$PDF")" = "%PDF-"
          stat -c '%s %n' "$PDF" | tee SIZE.txt
          sha256sum "$PDF" | tee SHA256SUMS.txt
          ls -lh "$PDF"

      - name: Upload original PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: yinxu-buci-zonglei-shima-kunio-1977
          path: |
            殷墟卜辞综类_岛邦男_1977.pdf
            SIZE.txt
            SHA256SUMS.txt
          compression-level: 0
          retention-days: 2
          if-no-files-found: error
