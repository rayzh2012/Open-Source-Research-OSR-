name: Baima Dictionary Split for Drive

on:
  push:
    paths:
      - '.github/workflows/baima-dictionary-fetch.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  split:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOURCE_RUN: '34016579330'
      SOURCE_ARTIFACT: 'baima-han-dacidian-9787226052457'
      PDF: 'Baima_Han_Dacidian_9787226052457.pdf'
    steps:
      - name: Recover preserved original PDF
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p source transport
          gh run download "$SOURCE_RUN" -R "$GITHUB_REPOSITORY" -n "$SOURCE_ARTIFACT" -D source
          mv "source/$PDF" "$PDF"
          test "$(head -c 5 "$PDF")" = "%PDF-"
          sha256sum "$PDF" | tee transport/ORIGINAL_SHA256SUMS.txt
          stat -c '%s %n' "$PDF" | tee transport/ORIGINAL_SIZE.txt

      - name: Split raw PDF into two byte-identical transport parts
        run: |
          set -euo pipefail
          bytes=$(stat -c '%s' "$PDF")
          half=$(( (bytes + 1) / 2 ))
          head -c "$half" "$PDF" > transport/Baima_Han_Dacidian.part01
          tail -c +$((half + 1)) "$PDF" > transport/Baima_Han_Dacidian.part02
          sha256sum transport/Baima_Han_Dacidian.part01 transport/Baima_Han_Dacidian.part02 | tee transport/PART_SHA256SUMS.txt
          cat transport/Baima_Han_Dacidian.part01 transport/Baima_Han_Dacidian.part02 > reconstructed.pdf
          cmp "$PDF" reconstructed.pdf
          sha256sum reconstructed.pdf | tee transport/RECONSTRUCTED_SHA256SUMS.txt
          ls -lh transport/Baima_Han_Dacidian.part0*

      - name: Upload part 1
        uses: actions/upload-artifact@v4
        with:
          name: baima-dictionary-part-01
          path: |
            transport/Baima_Han_Dacidian.part01
            transport/ORIGINAL_SHA256SUMS.txt
            transport/ORIGINAL_SIZE.txt
            transport/PART_SHA256SUMS.txt
            transport/RECONSTRUCTED_SHA256SUMS.txt
          compression-level: 0
          retention-days: 2
          if-no-files-found: error

      - name: Upload part 2
        uses: actions/upload-artifact@v4
        with:
          name: baima-dictionary-part-02
          path: |
            transport/Baima_Han_Dacidian.part02
            transport/ORIGINAL_SHA256SUMS.txt
            transport/ORIGINAL_SIZE.txt
            transport/PART_SHA256SUMS.txt
            transport/RECONSTRUCTED_SHA256SUMS.txt
          compression-level: 0
          retention-days: 2
          if-no-files-found: error
