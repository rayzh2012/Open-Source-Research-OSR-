name: Baima Dictionary Fast Text Scan

on:
  push:
    paths:
      - '.github/workflows/baima-dictionary-fetch.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOURCE_RUN: '34016579330'
      SOURCE_ARTIFACT: 'baima-han-dacidian-9787226052457'
      PDF: 'Baima_Han_Dacidian_9787226052457.pdf'
    steps:
      - name: Install poppler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends poppler-utils >/dev/null

      - name: Recover preserved original PDF artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p source
          gh run download "$SOURCE_RUN" -R "$GITHUB_REPOSITORY" -n "$SOURCE_ARTIFACT" -D source
          mv "source/$PDF" "$PDF"
          test "$(head -c 5 "$PDF")" = "%PDF-"
          sha256sum "$PDF" | tee SOURCE_SHA256SUMS.txt
          pdfinfo "$PDF" | tee PDFINFO.txt

      - name: Extract page-preserving text layer
        run: |
          mkdir -p output
          pdftotext -layout "$PDF" output/existing_text_layer.txt
          pdftotext -layout -nopgbrk "$PDF" output/existing_text_nopage.txt
          wc -c output/existing_text_layer.txt

      - name: High-recall target scan
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, unicodedata
          text=Path('output/existing_text_layer.txt').read_text('utf-8',errors='ignore')
          pages=text.split('\f')
          groups={
            'AIR_SIBLING_NAMES':['罗·阿曼格麻','罗阿曼格麻','萨曼格英','曼格','阿曼','格麻','格英','曼 格','阿 曼','格 麻','格 英','满格','蛮格','格玛','格马','格鹰'],
            'ANURA':['青蛙','蛙','癞蛤蟆','癞蛤蟆','蟾蜍','蟾','蛤蟆','蝌蚪'],
            'FISH_BONE':['鱼骨','魚骨','年日郭托','业日','業日'],
            'IDENTITY':['白马人','白馬人','白马语','白馬語','Pe','Pey']
          }
          out=[]
          summary=[]
          for g,terms in groups.items():
            found=[]
            for pno,page in enumerate(pages,1):
              hs=[t for t in terms if t in page]
              if not hs: continue
              found.append((pno,hs))
              lines=page.splitlines()
              for i,line in enumerate(lines):
                if any(t in line for t in hs):
                  lo=max(0,i-2); hi=min(len(lines),i+3)
                  out.append(f'===== {g} | PDF_PAGE_{pno} | {hs} =====\n'+'\n'.join(lines[lo:hi])+'\n')
            summary.append(f'{g}: {len(found)} pages; '+', '.join(f'p{p}:{"/".join(h)}' for p,h in found[:100]))
          Path('output/target_hits.txt').write_text('\n'.join(out),encoding='utf-8')
          Path('output/target_summary.txt').write_text('\n'.join(summary),encoding='utf-8')
          print('\n'.join(summary))
          PY
          cp SOURCE_SHA256SUMS.txt PDFINFO.txt output/

      - name: Upload fast scan artifacts
        uses: actions/upload-artifact@v4
        with:
          name: baima-dictionary-fast-scan
          path: |
            output/existing_text_layer.txt
            output/existing_text_nopage.txt
            output/target_hits.txt
            output/target_summary.txt
            output/PDFINFO.txt
            output/SOURCE_SHA256SUMS.txt
          compression-level: 6
          retention-days: 7
          if-no-files-found: error
