name: Fetch Sun Hua Sichuan Bronze Age

on:
  push:
    paths:
      - '.github/workflows/fetch-sunhua-sichuan-bronze.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOURCE_URL: 'https://www.ecsponline.com/yz/B5C6E125E1E0F4ACE90A44FD6235062E6000.pdf'
      PDF: 'Sun_Hua_Sichuan_Bronze_Age_2000.pdf'
    steps:
      - name: Download source PDF
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 6 --retry-all-errors --retry-delay 3 \
            --connect-timeout 30 --max-time 1500 \
            -A 'Mozilla/5.0' \
            "$SOURCE_URL" -o "$PDF"
          test "$(head -c 5 "$PDF")" = "%PDF-"
          stat -c '%s %n' "$PDF" | tee SIZE.txt
          sha256sum "$PDF" | tee SHA256SUMS.txt
          pdfinfo "$PDF" | tee PDFINFO.txt || true
          file "$PDF"

      - name: Extract research window
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pypdf import PdfReader, PdfWriter
          src='Sun_Hua_Sichuan_Bronze_Age_2000.pdf'
          out='Sun_Hua_p300-380.pdf'
          r=PdfReader(src)
          print('TOTAL_PAGES', len(r.pages))
          w=PdfWriter()
          start=max(1,300)
          end=min(len(r.pages),380)
          for p in range(start-1,end):
              w.add_page(r.pages[p])
          with open(out,'wb') as f:
              w.write(f)
          print('EXTRACTED', start, end, 'COUNT', end-start+1)
          PY
          stat -c '%s %n' Sun_Hua_p300-380.pdf | tee EXCERPT_SIZE.txt
          sha256sum Sun_Hua_p300-380.pdf | tee EXCERPT_SHA256.txt

      - name: Upload research excerpt
        uses: actions/upload-artifact@v4
        with:
          name: sunhua-sichuan-bronze-p300-380
          path: |
            Sun_Hua_p300-380.pdf
            SIZE.txt
            SHA256SUMS.txt
            PDFINFO.txt
            EXCERPT_SIZE.txt
            EXCERPT_SHA256.txt
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
